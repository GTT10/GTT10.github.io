name: Audit static archive

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF audit dependencies
        run: python -m pip install -r requirements.txt

      - name: Check generator and JavaScript syntax
        run: |
          python -m py_compile tools/*.py
          for file in js/*.js tools/*.mjs; do node --check "$file"; done

      - name: Audit HTML and local references
        run: node tools/audit-site.mjs

      - name: Audit PDF inventory and corrected content
        run: python tools/audit-pdfs.py
